<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelVault - Contacto</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="header">
    <div class="header__container">
      <a href="index.html" class="header__logo">PixelVault</a>
      <nav aria-label="Navegación principal">
        <ul class="header__nav-list">
          <li><a href="index.html" class="header__nav-link">Inicio</a></li>
          <li><a href="catalogo.html" class="header__nav-link">Catálogo</a></li>
          <li><a href="producto.html" class="header__nav-link">Destacado</a></li>
          <li><a href="contacto.html" class="header__nav-link header__nav-link--active">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <section class="section">
      <h1 class="section__title">Contacta con Nosotros</h1>
      <div class="card">
        <div class="card__body">
          <form action="#" method="post" class="contact-form">
            <div class="contact-form__group">
              <label for="nombre" class="contact-form__label">Nombre completo</label>
              <input type="text" id="nombre" name="nombre" class="contact-form__input" required>
            </div>
            <div class="contact-form__group">
              <label for="email" class="contact-form__label">Correo electrónico</label>
              <input type="email" id="email" name="email" class="contact-form__input" required>
            </div>
            <div class="contact-form__group">
              <label for="mensaje" class="contact-form__label">Tu consulta</label>
              <textarea id="mensaje" name="mensaje" rows="5" class="contact-form__input" required></textarea>
            </div>
            <button type="submit" class="button button--primary">Enviar Mensaje</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <p class="footer__copy">&copy; 2026 PixelVault - Proyecto Diseño de Interfaces 2º DAW.</p>
      <div class="footer__links">
        <a href="catalogo.html" class="footer__link">Catálogo</a>
        <a href="contacto.html" class="footer__link">Soporte y Contacto</a>
      </div>
    </div>
  </footer>
</body>
</html>
